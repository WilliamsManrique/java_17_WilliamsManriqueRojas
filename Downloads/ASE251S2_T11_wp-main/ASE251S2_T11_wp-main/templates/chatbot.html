<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Flotante</title>
    <link href="{{ url_for('static', filename='css/chatbot.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>

<body>
        <!-- Contenedor del chatbot -->
        <div id="chatbot-container" class="chatbot-container">
        <!-- Botón flotante -->
        <button id="chatbot-toggle" class="chatbot-button">💬</button>

        <!-- Ventana del chatbot -->
        <div id="chatbot-box" class="chatbot-box hidden">
            <div class="chatbot-header">
                <h3>Asistente Agrícola 🌱</h3>
                <button id="chatbot-close" class="close-btn">✖</button>
            </div>

            <div class="chatbot-messages" id="chatbot-messages">
                <div class="message bot"><strong>Bot:</strong> ¡Hola! 👋 ¿En qué puedo ayudarte hoy?</div>
            </div>

            <div class="chatbot-input">
                <input type="text" id="user-input" placeholder="Escribe tu mensaje...">
                <button id="send-btn">Enviar</button>
            </div>
        </div>
    </div>

    
    <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
